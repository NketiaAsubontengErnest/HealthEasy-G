name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL so the build and any database-backed checks run
    # against a real engine rather than a stub.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healtheasy_g
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healtheasy_g?schema=public
      SESSION_SECRET: ci-only-secret-value-that-is-long-enough-to-pass
      NEXT_PUBLIC_APP_NAME: HealthEasy-G HMS
      NEXT_PUBLIC_FACILITY_CODE: GAR-RIDGE-01

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Seed database
        run: npx tsx prisma/seed.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
